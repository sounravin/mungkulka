<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="bgGradApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F3EAD8"/>
    </linearGradient>
    <linearGradient id="goldGradApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6D3B"/>
    </linearGradient>
    <linearGradient id="blueGradApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <!-- Rounded Square Container for iOS -->
  <rect width="180" height="180" rx="40" fill="url(#bgGradApple)"/>
  
  <!-- Outer Ring -->
  <circle cx="90" cy="90" r="76" fill="#FFFFFF" stroke="url(#goldGradApple)" stroke-width="5"/>
  <circle cx="90" cy="90" r="67" fill="none" stroke="url(#blueGradApple)" stroke-width="6"/>
  <circle cx="90" cy="90" r="60" fill="none" stroke="url(#goldGradApple)" stroke-width="2"/>
  
  <!-- Top Flower Ornament -->
  <path d="M 90,40 C 86,44 82,48 90,52 C 98,48 94,44 90,40 Z" fill="url(#goldGradApple)"/>

  <!-- "ម.ក" Initials -->
  <text x="90" y="96" text-anchor="middle" font-family="'Moul', 'Battambang', serif" font-weight="bold" font-size="44" fill="url(#goldGradApple)">
    ម.ក
  </text>
  
  <!-- "មង្គលការ" Subtitle -->
  <text x="90" y="126" text-anchor="middle" font-family="'Moul', 'Battambang', serif" font-size="20" fill="url(#blueGradApple)">
    មង្គលការ
  </text>
</svg>
